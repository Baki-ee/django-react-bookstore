{% extends 'books/base.html' %}

{% block content %}
<div class="text-center mb-4">
    <h1 class="fw-bold text-primary">📚 Book List</h1>
    <p class="text-muted">Browse all the books added by users.</p>
</div>

{% if books %}
<div class="row">
    {% for book in books %}
    <div class="col-md-4 mb-4">
        <div class="card shadow-sm border-0">
            <div class="card-body">
                <h5 class="card-title text-dark fw-semibold">{{ book.title }}</h5>
                <p class="card-text text-secondary">by {{ book.author }}</p>
                <a href="#" class="btn btn-outline-primary btn-sm">View Reviews</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% else %}
<div class="alert alert-warning text-center">
    No books yet! <a href="{% url 'add_book' %}" class="alert-link">Add one here</a>.
</div>
{% endif %}
{% endblock %}
